name: terraform

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['terraform/**']

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: 1.9.0

jobs:
  plan-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '${{ env.TF_VERSION }}'}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_STAGING }}
          service_account:            ${{ vars.GCP_SA_TERRAFORM_STAGING }}
      - name: Init + plan
        working-directory: terraform/envs/staging
        run: |
          terraform fmt -recursive -check
          terraform init -backend-config="bucket=${{ vars.GCP_TFSTATE_BUCKET_STAGING }}"
          terraform plan -no-color -out=tfplan -var="project_id=${{ vars.GCP_PROJECT_STAGING }}" | tee plan.txt
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = '```\n' + fs.readFileSync('terraform/envs/staging/plan.txt', 'utf8').slice(0, 60000) + '\n```'
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body,
            })
      - name: Apply (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform/envs/staging
        run: terraform apply -auto-approve tfplan
