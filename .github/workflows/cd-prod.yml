name: cd-prod

on:
  push:
    tags: ['v*']

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_PROD }}
  REGION:     europe-west1
  CLUSTER:    travelmanager-prod

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production    # requires manual approval per GitHub environment rules
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [bff-gateway, identity-tenant, trip, booking-integrations, social, travel-info, destination, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_PROD }}
          service_account:            ${{ vars.GCP_SA_DEPLOY_PROD }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/travelmanager-${{ matrix.service }}/app:${{ github.ref_name }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/travelmanager-${{ matrix.service }}/app:stable

  rollout:
    needs: promote
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_PROD }}
          service_account:            ${{ vars.GCP_SA_DEPLOY_PROD }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location:     ${{ env.REGION }}
      - run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Helm upgrade
        run: |
          for svc in bff-gateway identity-tenant trip booking-integrations social travel-info destination notification; do
            helm upgrade --install $svc deploy/helm/$svc \
              -n shared-services --create-namespace \
              --set image.repository=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/travelmanager-$svc/app \
              --set image.tag=${{ github.ref_name }} \
              --wait --timeout 10m
          done
