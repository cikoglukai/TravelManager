name: loadtest-nightly

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

jobs:
  locust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/load/requirements.txt
      - run: pip install -r tests/load/requirements.txt
      - name: Locust periodic shape
        env:
          LOCUST_SHAPE: periodic
        run: |
          locust -f tests/load/locustfile.py \
            --host https://staging.travelmanager.app \
            --headless -u 200 -r 20 -t 30m \
            --html report.html --csv report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: locust-report-${{ github.run_id }}
          path: |
            report.html
            report_*.csv
