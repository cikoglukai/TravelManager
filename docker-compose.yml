# Local microservices stack. One-shot bring-up:
#   docker compose up --build
#
# Ports:
#   5433   postgres
#   6380   redis
#   8085   pubsub emulator
#   8090   bff-gateway          (Nuxt SSR + edge proxy — entrypoint for the UI)
#   8091   identity-tenant
#   8092   trip
#   8093   booking-integrations
#   8094   social
#   8095   travel-info
#   8096   destination
#   8097   notification

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - --quiet
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=local-tm
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pubsub-bootstrap:
    image: node:22-alpine
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
    working_dir: /repo
    volumes:
      - ./scripts/local:/repo:ro
    command: ["sh", "-c", "npm i --silent --prefix /tmp @google-cloud/pubsub && node /repo/bootstrap-pubsub.mjs"]
    restart: "no"

  bff-gateway:
    build:
      context: .
      dockerfile: services/bff-gateway/Dockerfile
    depends_on:
      - redis
      - pubsub-emulator
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      REDIS_URL: redis://redis:6379
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
      TRIP_SERVICE_URL: http://trip:8080
      IDENTITY_TENANT_URL: http://identity-tenant:8080
      SOCIAL_SERVICE_URL: http://social:8080
      TRAVEL_INFO_SERVICE_URL: http://travel-info:8080
      DESTINATION_SERVICE_URL: http://destination:8080
      BOOKING_INTEGRATIONS_URL: http://booking-integrations:8080
      NOTIFICATION_SERVICE_URL: http://notification:8080
      NUXT_PUBLIC_FIREBASE_API_KEY: ${NUXT_PUBLIC_FIREBASE_API_KEY:-}
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${NUXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NUXT_PUBLIC_FIREBASE_APP_ID: ${NUXT_PUBLIC_FIREBASE_APP_ID:-}
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
    restart: unless-stopped

  identity-tenant:
    build:
      context: .
      dockerfile: services/identity-tenant/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      DATABASE_URL_IDENTITY: postgresql://postgres:postgres@postgres:5432/travelmanager
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
      SUPERADMIN_UID: local-superadmin
    restart: unless-stopped

  trip:
    build:
      context: .
      dockerfile: services/trip/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      DATABASE_URL_TRIP: postgresql://postgres:postgres@postgres:5432/travelmanager
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
    restart: unless-stopped

  booking-integrations:
    build:
      context: .
      dockerfile: services/booking-integrations/Dockerfile
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8093:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  social:
    build:
      context: .
      dockerfile: services/social/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8094:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      SKIP_FIRESTORE: "1"
      SKIP_PUBSUB_VERIFY: "1"
      DATABASE_URL_SOCIAL: postgresql://postgres:postgres@postgres:5432/travelmanager
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
    restart: unless-stopped

  travel-info:
    build:
      context: .
      dockerfile: services/travel-info/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8095:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      SKIP_PUBSUB_VERIFY: "1"
      DATABASE_URL_TRAVEL_INFO: postgresql://postgres:postgres@postgres:5432/travelmanager
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    restart: unless-stopped

  destination:
    build:
      context: .
      dockerfile: services/destination/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8096:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      SKIP_PUBSUB_VERIFY: "1"
      DATABASE_URL_DESTINATION: postgresql://postgres:postgres@postgres:5432/travelmanager
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:8080"
    environment:
      NODE_ENV: development
      SKIP_AUTH: "1"
      SKIP_PUBSUB_VERIFY: "1"
      DATABASE_URL_NOTIFICATION: postgresql://postgres:postgres@postgres:5432/travelmanager
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local-tm
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@travelmanager.local}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:noreply@travelmanager.local}
    restart: unless-stopped

volumes:
  postgres_data:
