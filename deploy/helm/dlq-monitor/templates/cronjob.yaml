apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gsaEmail | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dlq-monitor
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure
          containers:
            - name: dlq-monitor
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                - name: GOOGLE_CLOUD_PROJECT
                  value: {{ .Values.projectId | quote }}
                - name: DLQ_ALERT_THRESHOLD
                  value: {{ .Values.threshold | quote }}
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  apk add --no-cache jq >/dev/null
                  PROJECT=$GOOGLE_CLOUD_PROJECT
                  THRESHOLD=${DLQ_ALERT_THRESHOLD:-50}
                  gcloud pubsub subscriptions list --project="$PROJECT" --format="value(name)" \
                    | grep '\.dlq\.drain$' | while read -r SUB; do
                    NAME="${SUB##*/}"
                    DEPTH=$(gcloud monitoring time-series list \
                      --project="$PROJECT" \
                      --filter="metric.type=\"pubsub.googleapis.com/subscription/num_undelivered_messages\" AND resource.label.subscription_id=\"$NAME\"" \
                      --format="value(points[0].value.int64Value)" 2>/dev/null | head -1)
                    DEPTH=${DEPTH:-0}
                    if [ "$DEPTH" -gt "$THRESHOLD" ]; then
                      echo "ALERT subscription=$NAME depth=$DEPTH threshold=$THRESHOLD"
                    fi
                  done
