serviceName: trip
replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/REPLACE-PROJECT/travelmanager-trip/app
  tag: latest

env:
  GOOGLE_CLOUD_PROJECT: REPLACE-PROJECT

envFromSecrets:
  - trip-secrets

externalSecrets:
  - name: trip-secrets
    keys:
      - secretKey: DATABASE_URL_TRIP
        remoteKey: travelmanager-trip-database-url

workloadIdentity:
  gsaEmail: trip-svc@REPLACE-PROJECT.iam.gserviceaccount.com

resources:
  requests: {cpu: 200m, memory: 384Mi}
  limits:   {cpu: 1,    memory: 768Mi}

hpa:           {enabled: true, minReplicas: 2, maxReplicas: 12, targetCPUUtilizationPercentage: 70}
pdb:           {enabled: true, minAvailable: 1}
networkPolicy: {enabled: true, allowedFromNamespace: shared-services}
serviceMonitor: {enabled: true}
