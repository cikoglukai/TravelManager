apiVersion: v2
name: observability
description: kube-prometheus-stack + custom-metrics-stackdriver-adapter umbrella
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: kube-prometheus-stack
    version: 65.x.x
    repository: https://prometheus-community.github.io/helm-charts
  - name: custom-metrics-stackdriver-adapter
    version: 0.x.x
    repository: https://kubernetes-sigs.github.io/custom-metrics-stackdriver-adapter
    condition: customMetrics.enabled
