serviceName: social
replicaCount: 2
image: {repository: europe-west1-docker.pkg.dev/REPLACE-PROJECT/travelmanager-social/app, tag: latest}

env:
  GOOGLE_CLOUD_PROJECT: REPLACE-PROJECT

envFromSecrets: [social-secrets]
externalSecrets:
  - name: social-secrets
    keys:
      - {secretKey: DATABASE_URL_SOCIAL, remoteKey: travelmanager-social-database-url}

workloadIdentity: {gsaEmail: social-svc@REPLACE-PROJECT.iam.gserviceaccount.com}
resources:
  requests: {cpu: 200m, memory: 384Mi}
  limits:   {cpu: 1,    memory: 768Mi}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  pubsubSubscription: trip.created.social-feed-fanout    # scale on backlog of fanout work
  pubsubMessagesPerPod: 100

pdb:           {enabled: true, minAvailable: 1}
networkPolicy: {enabled: true, allowedFromNamespace: shared-services}
serviceMonitor: {enabled: true}
