serviceName: bff-gateway
tenantId: shared
plan: shared
replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/REPLACE-PROJECT/travelmanager-bff-gateway/app
  tag: latest
  pullPolicy: IfNotPresent

env:
  TRIP_SERVICE_URL:           http://trip.shared-services.svc.cluster.local
  IDENTITY_TENANT_URL:        http://identity-tenant.shared-services.svc.cluster.local
  SOCIAL_SERVICE_URL:         http://social.shared-services.svc.cluster.local
  TRAVEL_INFO_SERVICE_URL:    http://travel-info.shared-services.svc.cluster.local
  DESTINATION_SERVICE_URL:    http://destination.shared-services.svc.cluster.local
  BOOKING_INTEGRATIONS_URL:   http://booking-integrations.shared-services.svc.cluster.local
  NOTIFICATION_SERVICE_URL:   http://notification.shared-services.svc.cluster.local

envFromSecrets:
  - bff-gateway-secrets        # FIREBASE_SERVICE_ACCOUNT, REDIS_URL

externalSecrets:
  - name: bff-gateway-secrets
    keys:
      - secretKey: FIREBASE_SERVICE_ACCOUNT
        remoteKey: travelmanager-firebase-service-account
      - secretKey: REDIS_URL
        remoteKey: travelmanager-redis-url

workloadIdentity:
  gsaEmail: bff-gateway-svc@REPLACE-PROJECT.iam.gserviceaccount.com

resources:
  # Nuxt SSR is heavier than the Phase-1 Nitro proxy — bump headroom.
  requests: {cpu: 300m, memory: 512Mi}
  limits:   {cpu: 2,    memory: 1Gi}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:            {enabled: true, minAvailable: 1}
networkPolicy:  {enabled: true, allowedFromNamespace: infra}
serviceMonitor: {enabled: true}

ingress:
  enabled: true
  hosts:
    - host: travelmanager.app
    - host: "*.travelmanager.app"
