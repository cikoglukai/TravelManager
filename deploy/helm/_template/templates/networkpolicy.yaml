{{- define "tm.networkPolicy" -}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tm.fullname" . }}
  labels:
    {{- include "tm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tm.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowedFromNamespace | default "infra" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff-gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    # Cloud SQL via PSC + Pub/Sub via PGA + RapidAPI via Cloud NAT
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
{{- end -}}
{{- end -}}
